<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Radar helps you discover AI websites and tools from the open web, powered by the FreeSERP API." />
    <meta name="theme-color" content="#f6f5f1" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('ai-radar:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0c1412' : '#f6f5f1');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AI Radar — Discover the AI web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
